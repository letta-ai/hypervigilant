# Hypervigilant project configuration.
version = 1
project = "my-project"
agent_id = "agent-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
model = "letta/auto"
include = ["**/*.md", "**/*.txt"]
exclude = ["**/node_modules/**", "**/.git/**", ".hypervigilant/**", "**/.hypervigilant/**"]
max_file_size_bytes = 1048576
max_scan_files = 100
max_scan_text_bytes = 65536
mode = "edit"
routing = "project"
state_dir = ".hypervigilant"
instructions = "Review each change in project context. Report concrete issues and make only necessary edits."

[destinations]
agent = true

# Add this section to require a durable HTTP receiver as another destination.
# Set agent = false above for HTTP-only operation; agent_id is then optional.
# [destinations.http]
# url = "https://stream.example.com/v1/events"
# auth_token_env = "HYPERVIGILANT_STREAM_TOKEN"
# request_timeout_ms = 10000

# Agent state backend. Use "local" for a fully local command-scoped App Server.
# Use "remote" with url/auth_token_env for a user-managed App Server.
[connection]
backend = "cloud"

[batching]
strategy = "debounce"
delay_ms = 500
max_wait_ms = 5000
window_ms = 2000

# Additional local Agent SDK client tools. File tools are managed separately.
[tools]
auto_allow = []
ask = []

[worktree]
enabled = false
auto_commit = true
branch_prefix = "hypervigilant"

[[prompt_rules]]
name = "knowledge-review"
match = ["notes/**", "docs/**"]
events = ["add", "change", "delete"]
prompt = "Check for contradictions, stale references, and missing follow-up work."
conversation = "knowledge-review"
